[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "materiais-em-lote"
version = "1.0.0"
description = "Planejamento local de fabricação e compra por listas técnicas multinível e quantidades exatas."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{name = "Martin Lofrano / LOFRANO TECNOLOGIA"}]
dependencies = ["openpyxl==3.1.5", "et-xmlfile==2.0.0"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Manufacturing",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
]

[project.scripts]
materiais-em-lote = "materiais_em_lote.cli:main"

[project.urls]
Homepage = "https://lofranotecnologia.com.br/"
Repository = "https://github.com/martinlofranodeoliveira/materiais-em-lote"
Issues = "https://github.com/martinlofranodeoliveira/materiais-em-lote/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["materiais_em_lote"]
namespaces = false
